name: photofix_ai
description: PhotoFix AI — Enhance, restore and upscale photos with AI.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  http_parser: ^4.1.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  path: ^1.9.0
  share_plus: ^10.1.3
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0
  gal: ^2.3.0
  image: ^4.3.0
  flutter_cache_manager: ^3.4.1
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  cached_network_image: ^3.4.1
  crop_your_image: ^2.0.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
